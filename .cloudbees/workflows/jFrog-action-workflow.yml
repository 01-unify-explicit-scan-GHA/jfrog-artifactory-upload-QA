apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: jfrog-upload-file
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  jfrog-upload-job:
    steps:
      - name: checkout-source-code
        uses: cloudbees-io/checkout@v1
      - name: create-test-zip
        uses: docker://alpine:latest
        shell: sh
        run: |
          apk add --no-cache zip
          mkdir -p ${{ cloudbees.workspace }}/test
          echo "hello" > ${{ cloudbees.workspace }}/test/hello.txt
          cd ${{ cloudbees.workspace }}/test
          zip jfrog_repo_test.zip hello.txt
      - name: jfrog-actions-workflow-upload-file
        uses: cloudbees-io/jfrog-artifactory-upload-file@v1
        with:
          url: ${{ vars.JFROG_URL }}
          username: ${{ vars.JFROG_ACTIONS_USERNAME }}
          password: ${{ secrets.JFROG_ACTIONS_PASSWORD }}
          file-path: ${{ cloudbees.workspace }}/test/jfrog_repo_test.zip
          artifactory-path: example-repo-local/jfrogtest/test.zip